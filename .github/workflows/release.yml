name: release

# 推送 v 開頭的版本標籤（例：v0.1.0）時打包 Windows / macOS / Linux 安裝檔並建立 GitHub Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target (macOS)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps

      # Windows 安裝檔內建 LGPL 版 ffmpeg（URL + sha256 釘死在 scripts/ffmpeg-manifest.json）。
      # 對不上就讓 build 失敗 —— 寧可沒有安裝檔，也不要出一個來路不明或授權有問題的。
      # macOS / Linux 這輪不內建：沒有可信的 LGPL 發布來源，而且 macOS 未簽章的子程序會被
      # Gatekeeper 擋下；deb / rpm 改用套件相依（見 tauri.conf.json 的 bundle.linux）。
      - name: Fetch bundled ffmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        run: node scripts/fetch-ffmpeg.mjs

      - name: Smoke-test bundled ffmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          ./src-tauri/resources/ffmpeg/ffmpeg.exe -hide_banner -version
          ./src-tauri/resources/ffmpeg/ffprobe.exe -hide_banner -version

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Podcast Cut ${{ github.ref_name }}"
          releaseBody: "Windows installer bundles FFmpeg (LGPL); macOS/Linux still need ffmpeg on PATH. See README for ttls API key and Claude Code CLI setup."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
