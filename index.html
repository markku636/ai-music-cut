<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>AI Music Cut</title>
    <script>
      // React 掛載前先套用深/淺類別，避免主題閃爍（FOUC）。判準與 theme.ts 的 readStoredThemeId 一致。
      (function () {
        try {
          var id = localStorage.getItem("aicut:themeId");
          if (id === "moonstone") document.documentElement.classList.add("light");
        } catch (e) {}
        try {
          document.documentElement.lang =
            localStorage.getItem("aicut:lang") === "en" ? "en" : "zh-Hant";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- 開場畫面：JS bundle 下載期間先給品牌深色畫面；視窗以 visible:false 啟動，
         這裡首次繪製後才呼叫 show_main_window，徹底消除白屏。
         動畫是純 CSS 寫在這裡而不是進 React —— 它必須在 bundle 還沒下載完就已經在動。 -->
    <div id="boot-splash">
      <style>
        #boot-splash {
          position: fixed; inset: 0; z-index: 300;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          background: radial-gradient(120% 90% at 50% 38%, #3a3950 0%, #2f303b 58%, #22212c 100%);
          transition: opacity 0.28s ease, transform 0.28s ease;
        }
        /* App 準備好時加上這個類別才開始退場，remove() 等淡出跑完再做 */
        #boot-splash.done { opacity: 0; transform: scale(1.03); pointer-events: none; }
        #boot-splash .art { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
        #boot-splash .glow {
          position: absolute; inset: -14%; border-radius: 50%;
          background: radial-gradient(circle, rgba(149, 128, 255, 0.42) 0%, rgba(149, 128, 255, 0) 68%);
          animation: splash-glow 2.4s ease-in-out infinite;
        }
        #boot-splash img {
          position: relative; width: 132px; height: 132px; display: block;
          filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.45));
          animation: splash-pop 0.62s cubic-bezier(0.2, 0.9, 0.25, 1) both, splash-float 3.6s ease-in-out 0.62s infinite;
        }
        #boot-splash .name {
          font: 600 15px/1.2 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
          letter-spacing: 0.04em; color: rgba(232, 230, 245, 0.86);
          animation: splash-rise 0.5s ease-out 0.18s both;
        }
        #boot-splash .bar {
          width: 112px; height: 2px; border-radius: 2px; overflow: hidden;
          background: rgba(149, 128, 255, 0.16);
          animation: splash-rise 0.5s ease-out 0.28s both;
        }
        #boot-splash .bar span {
          display: block; width: 40%; height: 100%; border-radius: 2px; background: #9580ff;
          animation: splash-slide 1.15s ease-in-out infinite;
        }
        @keyframes splash-pop { from { opacity: 0; transform: scale(0.78) translateY(10px); } to { opacity: 1; transform: none; } }
        @keyframes splash-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes splash-glow { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.1); } }
        @keyframes splash-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        @keyframes splash-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(290%); } }
        @media (prefers-reduced-motion: reduce) {
          #boot-splash .glow, #boot-splash img, #boot-splash .name, #boot-splash .bar, #boot-splash .bar span { animation: none; }
          #boot-splash .bar span { width: 100%; }
        }
      </style>
      <div class="art">
        <span class="glow"></span>
        <img src="/app-icon.png" alt="" draggable="false" />
      </div>
      <div class="name">AI Music Cut</div>
      <div class="bar"><span></span></div>
    </div>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            try {
              window.__TAURI__ && window.__TAURI__.core.invoke("show_main_window");
            } catch (e) {}
          });
        });
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
